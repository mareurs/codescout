# Which subtrees of this repo have no artifact key.
#
# A document outside the key space has no key (its lowercase filename stem) and takes no part
# in uniqueness; it also has no key-based identity. Exclusion is by whole subtree: a folder
# whose `readme.md` is excluded is excluded whole (the gate reports PartialFolderExclusion
# otherwise). The rule and its parser: src/librarian/identity/key_space.rs. The pre-commit
# check: scripts/pre-commit-key-space.sh.
#
# Glob semantics: `*` matches across `/`, patterns are anchored at the git root and are
# case-sensitive, and a bare directory name excludes its whole subtree.
#
# The principle: exclude a subtree whose file names are dictated from outside this repo or
# that is recorded evidence or fixture material, because the key migration cannot rename
# those files and every future sibling would otherwise be refused at commit time. Narrow an
# entry only where the names are ours. A problem left in scope is a real document the
# migration renames, not something to hide here. Re-check an entry by dropping it and running
# `codescout key-gate` in full mode: each entry below except `.claude`, removed alone, adds a
# key problem (an invalid key, a new duplicate-key group) or enlarges an existing group.
# `.claude` holds one tracked SKILL.md (and a tracked symlink to another skill) today and is
# listed on the principle, for the second skill.
exclude = [
    # Names dictated by the tool that reads them: pi's AGENTS.md and README.md, a systemd
    # unit's README.md. Example integration files for other tools, not repository documents.
    "contrib",
    # Names dictated by the agent harness: `.claude/skills/<name>/SKILL.md`. Every skill is
    # keyed `skill`, so a second skill would collide with the first.
    ".claude",
    # Recorded evidence of the ecc-integration dogfood runs: replayed AGENTS.md, CLAUDE.md and
    # SKILL.md copies (keys `agents`, `claude`, `skill`) beside the run reviews. Evidence is
    # kept as captured; the sibling `evidence.md` tracker is not under this folder and keeps
    # its key.
    "docs/trackers/ecc-integration/evidence",
    # Recorded evidence: raw review transcripts named `s1-claude-cold-0.review.md`, written by
    # the eval run and kept as captured (a dot in the name is an invalid key). The rest of
    # docs/evals, including the eval write-ups, is ours and keeps its keys.
    "docs/evals/data/2026-09-24-review-model-vs-context/runs",
    # Fixture material: prompt-surface snapshots (underscore names), a sample repository the
    # librarian tests index (its README.md is keyed by the invalid folder name `repo_a`), and
    # two sample repositories each holding a `docs/spec.md` (the key `spec`, twice).
    "tests/fixtures",
    "tests/librarian/fixtures",
    "tests/librarian/audit_doc_refs/fixtures",
    # Per-project and per-profile memory stores: each project under `.codescout/projects/`
    # carries its own `architecture.md`, `conventions.md`, ..., and this checkout's own
    # memories use the same topic names (`architecture`, `system-prompt`, `effort-steering`
    # collide with documents elsewhere). A memory is keyed by its topic inside its own store.
    ".codescout/projects",
    ".codescout/memories",
    # Persona memory: `.buddy/memory/INDEX.md` shares the key `index` with three trackers.
    ".buddy",
]
