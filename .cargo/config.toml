[build]
rustc-wrapper = "sccache"
# jobs intentionally unset — cargo defaults to the logical-CPU count, which is
# correct per machine (4 on the Windows VDI, more on CI). A hardcoded high value
# oversubscribed low-core machines (16x on the 4-core VDI) and, under EDR, spawns
# that many taxed rustc processes fighting for the cores. See WIN-16.

[target.x86_64-unknown-linux-gnu]
linker = "cc"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[alias]
# AMD / experiments dev loop: build the live MCP release binary WITH the Qdrant
# server stack compiled in. With `server-stack` on, VectorBackend::resolve()
# defaults to Qdrant, so `cargo rb` + the running llm-infra stack (.env.amd)
# gives the full hybrid retrieval path. Plain `cargo build --release` stays lean
# (sqlite-vec lite default) — which is what repo cloners get. Harmless on master:
# it only adds a command; nothing invokes it unless you type `cargo rb`.
#
# `local-embed` is deliberately NOT here, and its absence is the decision rather
# than an omission. The alias IS the live-MCP build, so what it omits, the running
# server cannot do: without `local-embed`, `~/.cargo/bin/codescout` (a symlink to
# target/release/codescout) cannot resolve a `local:` / `local-dir:` model at all,
# and the failure arrives at embed time, not at build time.
#
# ⚠ SUPERSEDED 2026-09-17 — READ THIS BEFORE ACTING ON THE PARAGRAPH ABOVE.
# `local-embed` is now in `default` (Cargo.toml), and this alias does NOT pass
# `--no-default-features`, so it inherits it: `cargo rb` builds WITH local-embed
# again, and the ~21MB / ort+fastembed saving described below is no longer being
# taken. The reasoning below was not wrong — it was scoped to THIS machine, whose
# embedder config is entirely HTTP. What changed is the population being optimised
# for: a default build must work for someone with no server at all, and
# `default_embed_model()` names a `local:` model, so a lean default shipped a
# binary that could not construct its own default config (measured; see
# `docs/issues/2026-09-17-the-default-build-cannot-run-the-default-embedding-model.md`).
#
# The text below is kept rather than deleted because it records a check worth not
# repeating — that no config file on this machine names a `local:` model — and
# because a future reader weighing the ~21MB back off should see what was already
# verified. To go lean again, this alias must opt out EXPLICITLY:
# `build --release --no-default-features --features server-stack,remote-embed,http,librarian`,
# which then hand-lists the default set and will not pick up features added to it.
#
# It was dropped 2026-09-15 after checking rather than assuming: `.env` and
# `.env.amd` configure the embedder entirely over HTTP —
# `CODESCOUT_EMBEDDER_URL=http://127.0.0.1:48081`, `PROTOCOL=llama-server`,
# `CodeRankEmbed-Q4_K_M.gguf`, plus sparse and reranker legs — and neither file,
# nor `.codescout/project.toml`, nor `workspace.toml`, names a `local:` or
# `local-dir:` model. (All four files were confirmed to EXIST first; an empty grep
# over a missing file proves nothing.) Saves ~21MB of binary and the ort/fastembed
# compile on every live rebuild.
#
# `CODESCOUT_MODEL_DIR=./models` is still set in `.env` and does NOT re-enable this:
# it is where a `local-dir:` model would be READ FROM, not a model selection. It is
# inert unless some model spec actually carries the prefix.
#
# TO GET IT BACK: `cargo build --release --features server-stack,local-embed`, or
# re-add it here. The feature itself is untouched in Cargo.toml and still has CI
# lanes on all three platforms plus the gate's clippy — this changes one build
# command, not the project's support for the ONNX path (GitHub #16 is open and
# wants that path extended, so do not delete the feature).
rb = "build --release --features server-stack"
