# Pre-commit hooks for codescout.
#
# Install:
#   pre-commit install
#
# There is no pre-push stage — see the block below before adding one.
#
# CI runs the same gate; this catches issues earlier.
#
# STAGE CHOICE IS LOAD-BEARING ON A SHARED CHECKOUT.
# Anything that COMPILES takes the shared `target/` lock, so a commit-stage cargo
# build serialises every concurrent session's commits — `Blocking waiting for file
# lock` was observed here on 2026-08-31 with four sessions active. Only checks that
# do not build may run at commit stage. `cargo fmt` parses without compiling and is
# therefore safe.
#
# THERE IS NO PUSH STAGE, DELIBERATELY. Read this before re-adding one.
# ---------------------------------------------------------------------------------
# `cargo clippy` and `cargo test --workspace` ran here at pre-push from 2026-08-31
# until 2026-09-01, and were withdrawn after refusing a push on a GREEN test run.
#
# pre-commit fails a hook when the working tree changes across it:
#
#     diff_after = _get_diff()
#     files_modified = diff_before != diff_after      # commands/run.py:203-206
#
# That is an unconditional WHOLE-TREE diff with no per-hook opt-out (verified in the
# installed 4.6.2 source). It assumes the hook is the only writer. On a shared
# checkout that assumption is false: any file ANY session writes during the hook's
# runtime lands in the after-snapshot and is attributed to the hook. The observed
# failure named `docs/trackers/claim-decay.md`, which nothing under src/ writes —
# `claim-decay` appears there exactly three times, all citations in comments.
#
# The window scales with hook duration. It is sub-second for the commit-stage checks
# below and 30-80s for `cargo test --workspace`, which on a four-session checkout
# fires often and fires on green.
#
# Two reasons not to simply tune it. CI runs exactly these commands and is
# authoritative. And a noisy pre-push hook teaches `--no-verify`, which also disarms
# the quiet commit-stage hook that works — a false alarm that trains people to
# disable the true alarm is a net-negative guard.
#
# A second, independent defect showed up in the same run: pre-commit raised
# `BlockingIOError: [Errno 11]` writing ~2300 lines of cargo output to a non-blocking
# pipe. Any verbose hook here will reproduce it; `--quiet` or redirect-and-print-on-
# failure is the mitigation if one is ever added.
#
# The full gate stays where it is documented and where it is run deliberately:
# CLAUDE.md § Development Commands, four commands in a load-bearing order.
repos:
  - repo: local
    hooks:
      # ---- commit stage: no build, no target/ lock ----------------------------
      #
      # `stages:` IS PINNED ON EVERY HOOK, AND SHOULD STAY THAT WAY.
      # This file sets no `default_stages`, and pre-commit then defaults an unpinned
      # hook to EVERY stage — `repository.py:123-124` falls back to
      # `root_config['default_stages']`, which `clientlib.py:515` sets to all of
      # `STAGES`. That is invisible today, because pre-commit's generated shim exists
      # only at `.git/hooks/pre-commit`, so no other stage ever invokes it. It becomes
      # visible the moment anyone runs `pre-commit install --hook-type <other>`: an
      # unpinned `always_run: true` hook fires there too and re-prints its refusal.
      # Pinning costs one line and keeps "configured for" equal to "runs at".
      #
      # The `prepare-commit-msg` and `post-index-change` hooks this repo installs are
      # deliberately NOT routed through this file — see scripts/install-hooks.sh for
      # why (pre-commit stashes all unstaged work once per installed stage, and cannot
      # host `post-index-change` at all: it is absent from `clientlib.py`'s HOOK_TYPES).

      - id: unreviewed-content
        name: refuse a pathspec commit carrying unstaged content
        entry: scripts/pre-commit-unreviewed-content.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: foreign-index
        name: refuse an index commit carrying another session's staged paths
        entry: scripts/pre-commit-foreign-index.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Reads the INDEX (`git ls-files` + `git show :<path>`), never the working tree, so it
      # answers the question the COMMIT poses. `tests/issue_clusters.rs` structurally cannot:
      # it reads the working tree, so it certifies the state on disk and stays GREEN while a
      # partial commit ships a state that never existed there
      # (`reconnaissance-patterns:R-155`). Measured at `461c037a`, which published counts of
      # 3/1/2 against zero members at HEAD with the gate green throughout.
      #
      # THREE surfaces, not one: the Index cell, and the bare `n=` in each entry's
      # `**Members:**` and `**Promotes to:**` fields. They drift independently — measured
      # 2026-09-01, the cells were gated from 14:27 while four judgement fields went on
      # reasoning from superseded counts for hours (`0c5bab41`), and `**Promotes to:**` is the
      # one that REASONS from the count rather than merely stating it.
      #
      # A BACKTICKED `n=N` is a quotation of what a line used to say and is deliberately not
      # checked; bare means live. That escape is the only thing separating the two, and it fails
      # SAFE: an un-backticked quote produces a loud false report, never a silent miss. The
      # refusal text says so, because the wrong repair — "correcting" a true historical figure —
      # is the one nothing downstream would catch.
      #
      # Named for what it covers. Counts written as prose numerals ("the 18 members") are
      # invisible by construction: of four hand-swept drifts it catches two, measured. A gate
      # whose coverage is narrower than its name is `IC-14`, defined in the ledger it polices.
      #
      # Python, not `cargo test --test issue_clusters`, per the stage rule at the top of this
      # file: that costs ~6.9s warm and takes the shared `target/` lock. This is <0.2s and
      # builds nothing. The duplicated parse logic is held in sync by a MECHANISM rather than
      # by care — `the_hook_script_agrees_with_this_gate` and
      # `the_hook_script_agrees_on_both_yaml_tag_styles` red if the two derivations diverge.
      # The second exists because the first cannot see it: no bug file in the corpus carries a
      # `cluster/` tag in YAML flow style, so deleting that arm from the Python leaves the
      # corpus-driven check passing. Verified by mutation, not assumed.
      #
      # Scoped by `files:` rather than `always_run` — a commit touching neither the ledger nor
      # a bug file cannot break this invariant, and a hook that fires on every commit to say
      # nothing is how `--no-verify` gets learned.
      #
      # THE REPORTING SCOPE IS NARROWER THAN THE INVARIANT, and two sessions misread this the
      # same way within an hour, so it is stated here rather than left to be inferred.
      # `files:` matches the paths in YOUR COMMIT, not the shared index. So an already-broken
      # ledger state — a bug file staged with its ledger edit unstaged, the coupling this hook
      # exists for — does NOT block an arbitrary committer. It blocks only one whose own commit
      # touches the ledger or a bug file. Everyone else commits straight past it and never
      # learns it exists. Measured 2026-09-01: a peer flagged "whoever commits next will meet
      # it", the next commit was markdown-only, the hook printed `(no files to check) Skipped`,
      # and the broken index survived untouched.
      #
      # That is a LATENCY bound, not a correctness hole — the state cannot be committed by
      # anyone it would falsify — and widening it would refuse commits that neither caused the
      # break nor can repair it. But "the next commit will catch it" is the natural reading and
      # it is wrong; the honest claim is "the next IN-SCOPE commit will".
      - id: ledger-counts
        name: refuse a stored count, or a class gaining a member it does not name
        entry: scripts/pre-commit-ledger-counts.py
        language: system
        pass_filenames: false
        files: ^(docs/trackers/issue-clusters\.md|docs/issues/.*\.md)$
        stages: [pre-commit]

      # SCOPED TO THE STAGED FILES, not the workspace.
      #
      # `cargo fmt` has no file-list form — it formats every target of every workspace member —
      # so `pass_filenames: false` meant a commit staging one `.rs` parsed all 408. Measured
      # 2026-09-01: ~2000 ms whole-tree against ~40 ms for a single file.
      #
      # That duration is not a comfort metric. It is the window in which another session's write
      # lands in pre-commit's after-snapshot and is attributed to this hook (see the whole-tree
      # diff described at the top of this file). It fired twice on 2026-09-01 on a six-session
      # checkout, and the second one taught a `--no-verify` — the exact outcome that block warns
      # a noisy hook produces.
      #
      # `--edition 2021` IS NOT OPTIONAL: standalone `rustfmt` defaults to 2015 and would misparse
      # modern syntax, where `cargo fmt` reads the edition from `Cargo.toml`. It duplicates a
      # manifest value, so `tests/hook_config.rs` fails if the two ever drift. There is no
      # `rustfmt.toml` in this repo, so style is otherwise identical to what `cargo fmt` applied.
      #
      # A staged CRATE ROOT still recurses: `rustfmt` formats the `mod` children of any file it is
      # given, and `--skip-children` is nightly-only (verified on 1.9.0-stable). So `lib.rs` /
      # `main.rs` commits keep roughly the old window (measured 1868 ms) — 8 of the last 300
      # `.rs`-touching commits. The other 289 drop to one file. This is never WORSE than the
      # previous behaviour: one crate's module tree is a subset of the workspace.
      - id: cargo-fmt
        name: rustfmt --check (staged files)
        entry: rustfmt --edition 2021 --check
        language: system
        pass_filenames: true
        types: [rust]
        stages: [pre-commit]
