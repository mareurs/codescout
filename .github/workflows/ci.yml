name: CI

on:
  push:
    branches: [master, experiments]
  pull_request:

# One 15-job matrix per push starves the runner pool when pushes land in a row: on
# 2026-08-06, six pushes to `experiments` left 72 jobs contending, with the tip's run
# queued behind ~57 jobs belonging to commits it already superseded. Superseding runs
# for the same ref fixes that at the source. `master` is exempt — a protected branch's
# runs must always complete, never be cancelled by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

# No job installs a toolchain. `rust-toolchain.toml` pins the version and declares the
# components and targets, and rustup honors it automatically on the first cargo call in
# the repo — so a toolchain-install step is not just redundant here, it is harmful.
#
# DO NOT add `dtolnay/rust-toolchain` back. That action exports RUSTUP_TOOLCHAIN for
# subsequent steps, and the environment variable OVERRIDES rust-toolchain.toml. The jobs
# would then run on whatever the action resolved while the pin file sat inert, which is
# precisely the local-vs-CI skew the pin exists to remove — and it would be silent,
# because everything still compiles. See rust-toolchain.toml for the W-9 / F-9 history.
#
# The one exception is the `msrv` job, which deliberately installs 1.88 and invokes it
# as `cargo +1.88` so the explicit override beats the pin file. Read its comment before
# touching it.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check

  # The shell suites under tests/ had NO runner until 2026-09-01. Measured that day:
  # `tests/hooks-discrimination.sh` (41 cases) and `tests/file-provenance.sh` (58) —
  # 99 assertions guarding the shared-checkout git hooks and the write-provenance
  # probe — were referenced from twelve places, every one of them a bug file, a plan
  # or a tracker. Nothing in CI, .pre-commit-config.yaml, or any Makefile invoked
  # either. Both were green, and had been hand-run once and cited in a commit message.
  #
  # That is the exact anti-pattern hooks-discrimination.sh was written to replace. Its
  # own header says so: "Its precedent was a hand-run matrix pasted into a commit
  # message, which is evidence about one instant and cannot fail a later build." The
  # replacement inherited the defect it named — a suite nothing runs is evidence about
  # one instant too. CLAUDE.md § Testing Discipline states the general form: loudness
  # is a property of a PATH, and an alarm nothing reaches is exactly as informative as
  # no alarm.
  #
  # tests/peer-sessions.sh (10 cases) was written against this job rather than beside
  # it — the archive trigger for the bug it closes demands a regression test, and a
  # test with no runner does not satisfy that in substance.
  #
  # Both suites are self-contained — they build fixtures under `mktemp -d` and never
  # read the real ~/.claude or this checkout, which matters because several sessions
  # share it. They need git, python3 and sqlite3; ubuntu-latest has all three.
  #
  # tests/mcp-smoke-{rust,kotlin}.sh are deliberately NOT here. They drive a live MCP
  # server and fail outside that setup; the `test-server-stack` job below is the lane
  # that owns the running-stack case.
  shell-tests:
    name: Shell suites (hooks, provenance, peer-sessions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # file-provenance.sh derives a default window from "when was this path last
          # committed", so a depth-1 checkout gives it no history to read.
          fetch-depth: 0
      - name: Identify a committer (the hook suites build throwaway git repos)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name  CI
          git config --global init.defaultBranch master
      - run: bash tests/hooks-discrimination.sh
      - run: bash tests/file-provenance.sh
      - run: bash tests/peer-sessions.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings
      # --workspace --all-targets --features local-embed: the bare command
      # above only lints the root package's non-test targets with default
      # features, which don't include local-embed — so codescout-embed's
      # `local` module (cfg-gated on that feature) is never even compiled
      # here, and nothing in it, tests included, is clippy-checked in CI.
      # Same root cause as the `test` job's --workspace gap above, just one
      # command over. Verified empirically 2026-08-11: `cargo clippy --
      # -D warnings` shows `Checking codescout-embed` but that's the
      # default-features build (no `local` module); this second pass is
      # what actually reaches local.rs and its tests.
      - run: cargo clippy --workspace --all-targets --features local-embed -- -D warnings

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.config.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config:
          - name: default
            flags: ""
          - name: local-embed
            flags: "--features local-embed --no-default-features"
          - name: no-features
            flags: "--no-default-features"
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.config.name }}
      # Tests with the librarian feature on (default + local-embed configs)
      # construct CodeScoutServer instances which try to build_tool_context.
      # That call requires a librarian workspace file; seed an empty one so
      # the relevant tools register on fresh CI runners. Use LIBRARIAN_WORKSPACE
      # env var (per src/librarian/mod.rs:32) to point at a fixed path, avoiding
      # the per-platform dirs::config_dir() differences ($HOME/.config on Linux,
      # $HOME/Library/Application Support on macOS, $APPDATA on Windows). v6
      # catalog tolerates zero roots.
      #
      # Use ${{ runner.temp }} (native path on each platform) instead of bash $HOME:
      # on Windows, bash $HOME is the Git Bash POSIX form (/c/Users/...) which
      # Rust on Windows cannot read as a file path. runner.temp is D:\a\_temp
      # on Windows and /home/runner/work/_temp on Linux — always native.
      - name: Seed empty librarian workspace
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/codescout-ci"
          touch "${{ runner.temp }}/codescout-ci/workspace.toml"
          echo "LIBRARIAN_WORKSPACE=${{ runner.temp }}/codescout-ci/workspace.toml" >> "$GITHUB_ENV"
      # The local-embed lane needs real AllMiniLM-L6-v2 weights on disk for
      # from_dir_produces_a_stable_384d_vector and
      # from_dir_matches_the_hub_path_for_the_same_model
      # (crates/codescout-embed/src/local.rs) — the only tests that catch a
      # correctly-shaped-but-silently-wrong vector (wrong tokenizer/pooling).
      # Every other lane sets the explicit opt-out below instead, so the
      # tests are skipped on purpose rather than failing on a lane that was
      # never meant to carry the weights.
      #
      # Use ${{ runner.temp }} rather than bash $HOME: on Windows, bash $HOME
      # is the Git Bash POSIX form (/c/Users/...), which Rust on Windows
      # cannot read as a file path — the same reasoning as the
      # librarian-workspace seed step above, and this path is consumed the
      # same way (an env var that becomes a Rust PathBuf).
      #
      # Cache restores BEFORE the download (not after) so a hit skips the
      # curl entirely — key includes ${{ matrix.os }} (matching this file's
      # own rust-cache key convention two steps up) so three OSes racing to
      # save the same un-scoped key don't stomp each other's save.
      - name: Cache ONNX weights
        id: onnx-cache
        if: matrix.config.name == 'local-embed'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/codescout-onnx
          key: ${{ matrix.os }}-onnx-all-minilm-l6-v2-q-v1

      - name: Seed ONNX weights (local-embed lane only, cache miss)
        if: matrix.config.name == 'local-embed' && steps.onnx-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ runner.temp }}/codescout-onnx/all-MiniLM-L6-v2"
          mkdir -p "$DIR/onnx"
          BASE="https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main"
          curl -fsSL "$BASE/onnx/model_quantized.onnx" -o "$DIR/onnx/model_quantized.onnx"
          for f in tokenizer.json config.json special_tokens_map.json tokenizer_config.json; do
            curl -fsSL "$BASE/$f" -o "$DIR/$f"
          done

      # from_dir_matches_the_hub_path_for_the_same_model also builds an embedder
      # via the hub path (LocalEmbedder::new), which pulls AllMiniLM-L6-v2-Q into
      # fastembed's own cache — FASTEMBED_CACHE_DIR if set, else `.fastembed_cache`
      # relative to CWD (Cargo runs codescout-embed's own test binary from that
      # package's directory, not the workspace root — see the .gitignore fix in
      # this same PR). Left unset, that's a second, uncached ~22MB download per
      # job on three OSes, and an HF hiccup fails the lane on `.expect("hub model
      # must load")`. Point it at a subdirectory of the same cached tree above so
      # the one cache step covers both the from_dir weights and this download.
      - name: Point env at the cached ONNX/fastembed dirs (local-embed lane only)
        if: matrix.config.name == 'local-embed'
        shell: bash
        run: |
          echo "CODESCOUT_TEST_ONNX_DIR=${{ runner.temp }}/codescout-onnx/all-MiniLM-L6-v2" >> "$GITHUB_ENV"
          echo "FASTEMBED_CACHE_DIR=${{ runner.temp }}/codescout-onnx/fastembed-cache" >> "$GITHUB_ENV"

      - name: Opt out of ONNX tests (non-local-embed lanes)
        if: matrix.config.name != 'local-embed'
        shell: bash
        run: echo "CODESCOUT_SKIP_ONNX_TESTS=1" >> "$GITHUB_ENV"
      # --workspace: without it, `cargo test` here only builds the default
      # member of this non-virtual workspace (the root `codescout` package —
      # see `default-members` in the Cargo reference). codescout-embed compiles
      # as a dependency but its own `#[cfg(test)]` suite — chunker tests, the
      # smoke test, and every local.rs test including the two added in this
      # task — never runs. Verified empirically 2026-08-11: bare
      # `cargo test --features local-embed --no-default-features` shows
      # `codescout-embed` only in the Compiling lines, never in a `Running`
      # line; adding `--workspace` makes it appear and all 27 of its tests
      # execute, with 0 regressions across all three configs.
      - run: cargo test --workspace ${{ matrix.config.flags }}

  # The configuration `cargo rb` actually ships.
  #
  # `.cargo/config.toml` defines `rb = "build --release --features server-stack"`,
  # and that is the command CLAUDE.md mandates for the live MCP release binary. Until
  # 2026-08-08 no lane compiled it, so the build everyone runs was the one build CI
  # never built — and every `#[cfg(feature = "server-stack")]` test was skipped
  # silently, which is indistinguishable from a test that does not exist. When the
  # lane was finally run it failed immediately, on a real defect
  # (docs/issues/archive/2026-08-08-index-probe-scrolls-the-whole-corpus-to-answer-a-yes-no.md).
  #
  # Linux-only on purpose: `cargo rb` is the Linux dev-box build, and the matrix above
  # already covers default/lean across three OSes. The point is that SOME lane compiles
  # this, not that every platform does.
  #
  # No Qdrant service container is needed — the tests are hermetic. `check_has_index`
  # returns false when the stack is unreachable, and the cache test drives
  # `resolve_first_probe` directly rather than performing a live probe. If a future test
  # here needs a live stack, give it a service container rather than making this lane
  # depend on ambient reachability.
  test-server-stack:
    name: Test (server-stack — the build cargo rb ships)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-latest-server-stack
      # server-stack sits on top of the default feature set, so `librarian` is on and
      # build_tool_context needs a workspace file — same seeding as the matrix job.
      - name: Seed empty librarian workspace
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/codescout-ci"
          touch "${{ runner.temp }}/codescout-ci/workspace.toml"
          echo "LIBRARIAN_WORKSPACE=${{ runner.temp }}/codescout-ci/workspace.toml" >> "$GITHUB_ENV"
      - run: cargo clippy --features server-stack --all-targets -- -D warnings
      - run: cargo test --features server-stack

  # Compile-only lanes for the opt-in features nothing else builds.
  #
  # `dashboard` and `local-embed-dynamic` are in neither `default` nor any other lane,
  # so until 2026-08-08 they were bit-rot candidates for the same reason `server-stack`
  # was — nothing compiled them, and nothing said so. A `cargo check` is enough: these
  # are opt-in build configurations, and the question is whether they still compile, not
  # whether their behaviour is covered.
  #
  # tests/feature_lanes.rs enforces that every feature is either built somewhere,
  # reached through `default`, or explicitly exempt with a reason. Adding a feature
  # without doing one of those fails that test — which is the point.
  feature-check:
    name: Feature check (opt-in build configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-latest-feature-check
      - run: cargo check --features dashboard --all-targets
      - run: cargo check --features local-embed-dynamic --all-targets
      # `retrieval-e2e` is EXEMPT (tests/feature_lanes.rs) from *running* — it needs a
      # live Qdrant + TEI/Ollama stack no CI runner has. That justifies not running
      # tests/retrieval_e2e.rs, not skipping compilation of it: a `cargo check` here
      # is exactly the "enough to catch bit-rot" bar this job's own header comment
      # describes, and tests/retrieval_e2e.rs previously rotted for a full review
      # round (4 call sites broke under a `RetrievalClient::from_env` signature
      # change with nothing here to catch it) — the same shape as the archived
      # server-stack bit-rot (0863519e142b71bc) this job exists to prevent.
      - run: cargo check --features retrieval-e2e --all-targets
      # The five `e2e-*` lanes are EXEMPT (tests/feature_lanes.rs) from *running* too —
      # each needs a language server (rust-analyzer, pyright, typescript-language-server,
      # kotlin-lsp, jdtls) no runner has. Exactly the distinction drawn for
      # `retrieval-e2e` above, and it was simply never applied here: all five then
      # stopped compiling at once — `ToolContext` grew a field and `tests/e2e/harness.rs`
      # never got it — while `cargo test` stayed green throughout, because nothing builds
      # a feature-gated target that no lane names. Found by accident, not by a gate
      # (bug-fix-session-log F-62). `e2e` is the meta-feature enabling all five, so this
      # one check covers the family; `every_exempt_feature_is_still_compiled_somewhere`
      # now fails if any exemption loses its compile lane.
      - run: cargo check --features e2e --all-targets

  windows-gnu:
    name: Windows-gnu cross (MinGW + wine)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW + wine
        # WINE IS PINNED, and the pin is the point of this step rather than a detail.
        #
        # Ubuntu's own `wine` package gave this lane 9.0 while the local loop ran 11.16, and
        # that divergence is IC-5 ("the reproduction environment is not the gating
        # environment"): nine tests in group 6 below are skipped for hangs that do NOT
        # reproduce locally, so the lane withholds coverage for a reason belonging to the
        # emulator rather than to codescout. Un-skipping them is gated on this pin, not the
        # other way round.
        #
        # `winehq-devel` and NOT `winehq-staging`: staging carries extra out-of-tree patches,
        # and the local box runs vanilla wine (Arch `wine 11.16-1`), so devel is the build
        # that actually matches. `winehq-devel` Depends on `wine-devel (= <exact>)`, so
        # pinning the metapackage cascades and no sub-package needs naming.
        #
        # The codename is READ FROM THE RUNNER, never hardcoded — `ubuntu-latest` moves, and a
        # baked-in `noble` would decay silently into an apt 404 blamed on WineHQ. The VERSION
        # is hardcoded on purpose, because matching the local loop is the whole objective; it
        # is a constant that WILL decay as local wine moves, so it names what it was matched
        # to and when. Re-check with `wine --version` locally against `WINE_PIN`, and note
        # scripts/build-windows.sh already prints the lane's wine at the top of every `test`
        # run so a local and a lane log are directly comparable.
        #   Matched to local `wine-11.16` (Arch, 2026-09-02).
        #   Available for this dist as `winehq-devel=11.16~<codename>-1`.
        env:
          WINE_PIN: "11.16"
        run: |
          set -euo pipefail
          . /etc/os-release
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -qNP /etc/apt/sources.list.d/ \
            "https://dl.winehq.org/wine-builds/ubuntu/dists/${UBUNTU_CODENAME}/winehq-${UBUNTU_CODENAME}.sources"
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 p7zip-full
          sudo apt-get install -y --install-recommends \
            "winehq-devel=${WINE_PIN}~${UBUNTU_CODENAME}-1"
          # WineHQ installs to /opt/wine-devel/bin and ships NO /usr/bin/wine — verified by
          # extracting wine-devel_11.16~noble-1_amd64.deb, whose payload is entirely under
          # ./opt/. Ubuntu's own `wine` package did put it on PATH, so this line is the whole
          # difference between the pin working and the lane dying on `wine: not found`:
          # build-windows.sh sets CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER="wine", a bare
          # name resolved from PATH.
          echo "/opt/wine-devel/bin" >> "$GITHUB_PATH"
          # Fail loudly here rather than 40 minutes later in a test diff: an apt that resolved
          # to some other wine makes every result below incomparable to a local run.
          # Absolute path, because $GITHUB_PATH only reaches LATER steps, not this one.
          got="$(/opt/wine-devel/bin/wine --version)"
          echo ">>> wine pinned to: ${got}"
          case "${got}" in
            wine-"${WINE_PIN}"*) ;;
            *) echo "::error::wine is ${got}, expected wine-${WINE_PIN} — the pin did not take"; exit 1 ;;
          esac
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gnu-cross
      - name: Cross-build (default features)
        run: scripts/build-windows.sh build
      # The host Clippy job cannot see this cfg. #[cfg(windows)] code is invisible to
      # it, and code it CAN see may lint differently once the #[cfg(unix)] arms are
      # erased — a `return` becomes needless when everything after it compiles out.
      # Two such lints reached this branch and were only found by running clippy on a
      # Windows host, which is exactly the manual step this lane exists to replace.
      # docs/issues/archive/2026-08-08-clippy-pre-existing-drift-stable-gnu-toolchain.md
      - name: Cross-clippy (default features)
        run: scripts/build-windows.sh clippy --all-targets -- -D warnings

      # Anything that shells out needs a WINDOWS bash: codescout runs commands through
      # Git Bash, and wine ships none. Without one, 8 tests die on "no POSIX shell
      # available" — 6 of them the guide_hint cluster this lane deliberately UN-skipped
      # on 2026-07-05 (see the skip-list comment below), plus 2 run_command tests.
      # Re-skipping them would hand back coverage someone argued for; giving the lane a
      # shell keeps it. It also matters for signal, not just count: locally this gap was
      # hiding a real Windows defect behind 8 environmental failures until the shell was
      # supplied (W-59, docs/trackers/bug-fix-session-log.md).
      #
      # OUTCOME (run 32961510592): 7 of the 8 pass. The 8th is skipped below for a
      # different, measured reason — see the heredoc entry in the skip list.
      #
      # PortableGit is a 7z SELF-EXTRACTING archive, so `7z x` unpacks it here with no
      # installer executing. Cache restores BEFORE the download, same convention as the
      # ONNX weights step in the matrix job above.
      - name: Cache PortableGit
        id: portablegit-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/portable-git
          key: portable-git-2.55.0.5-64-bit

      - name: Seed PortableGit (cache miss)
        if: steps.portablegit-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ runner.temp }}/portable-git"
          mkdir -p "$DIR"
          URL="https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/PortableGit-2.55.0.5-64-bit.7z.exe"
          curl -fsSL "$URL" -o "${{ runner.temp }}/PortableGit.7z.exe"
          7z x -y -o"$DIR" "${{ runner.temp }}/PortableGit.7z.exe" > /dev/null

      # Both values must be WINDOWS paths: wine maps `/` to `Z:`, and `resolve_git_bash`
      # does a plain `is_file()` probe that a Unix path fails SILENTLY — the symptom is
      # the same 8 failures, with nothing pointing at the variable.
      #
      # CODESCOUT_BASH fixes the SHELL. It does not help the handful of tests that invoke
      # `git` DIRECTLY rather than through Git Bash — those die on `program not found`
      # until `git.exe` is on the WINDOWS path, which a Unix PATH entry does not affect.
      # WINEPATH is that knob. Worth 3 tests, measured 2026-08-26.
      - name: Point codescout at Git Bash under wine
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ runner.temp }}/portable-git"
          UNIX_PATH="$DIR/bin/bash.exe"
          test -f "$UNIX_PATH" || { echo "PortableGit missing at $UNIX_PATH" >&2; exit 1; }
          test -f "$DIR/cmd/git.exe" || { echo "git.exe missing at $DIR/cmd" >&2; exit 1; }
          echo "CODESCOUT_BASH=Z:${UNIX_PATH//\//\\}" >> "$GITHUB_ENV"
          echo "WINEPATH=Z:${DIR//\//\\}\\cmd" >> "$GITHUB_ENV"
      # SKIP LIST — 10 entries covering 13 tests, every one classified below.
      #
      # MEASURED, in two passes, and the second pass is the one that counts.
      #   Locally (wine 11.16, zero skips): exactly these fail.
      #   On THIS lane (wine 9.0 — the PRE-PIN lane; it runs 11.16 since 2026-09-02, so read
      #   this row as history rather than as current state, run 32975930504): dropping 22
      #   stale entries passed 21 of
      #   22 — so the local measurement transferred almost perfectly, and the ONE that did
      #   not turned out to share a cause with a skip already here (group 6).
      # Then WINEPATH retired 3 more (group 2 below), leaving 8.
      #
      # The 22 had accumulated since the lane gained a Git Bash and named tests that pass —
      # including two in the block historically blamed on a wine-broken glob walk. A stale
      # skip is not free: it reads as coverage while silently withholding it, and this is
      # CI's only gnu-ABI lane (windows-latest is MSVC). Hence per-entry justification
      # rather than per-block.
      #
      # Add nothing here without a measured reason and an un-skip protocol.
      #
      # 1. GLOB-WALK CLUSTER (6 tests, 3 entries) — bisect-proven pre-existing wine failures,
      #    NOT regressions: symbols_path_type (x4), symbols_name_path_pattern_in_directory,
      #    include_docs_attaches_docs_in_search_mode.
      #    Inventory: docs/issues/2026-07-02-windows-gnu-wine-20-test-failures.md (WIN-27)
      #
      # 2. RESOLVED 2026-08-26, kept here as the record of a protocol that worked.
      #    activate_populates_head_sha, check_index_scope_respects_gitignore and
      #    reindex_backfills_commits_table died on `NotFound: program not found` because they
      #    invoke `git` DIRECTLY rather than through Git Bash, so CODESCOUT_BASH never reached
      #    them. Setting WINEPATH to PortableGit's `cmd/` (above) fixes all three. They are no
      #    longer skipped. If they regress, check that step's `git.exe` guard first.
      #
      # 3. format_compact_live_renders_claude_md_as_map_shape — permanent for any CROSS-COMPILED
      #    lane, by construction. The test deliberately reads the repo's real CLAUDE.md via
      #    `env!("CARGO_MANIFEST_DIR")`, which bakes in the BUILD machine's path at compile time.
      #    Cross-compiling from Linux that is a Unix root, and `Path::join` under Windows
      #    semantics then yields a hybrid with no drive letter:
      #      relative path '/home/runner/work/codescout/codescout\CLAUDE.md' requires an active project
      #    It passes on windows-latest, where CARGO_MANIFEST_DIR is a real Windows path. Do NOT
      #    "fix" the fixture by making the path absolute — the path IS the build machine's, and
      #    using the real CLAUDE.md is the whole point of the test.
      #
      # 4. background_command_with_quotes_captures_output — permanent, root cause KNOWN
      #    (2026-08-07): wine has no Python launcher and the test's command is `py -c "..."`. Run
      #    under wine it captures cmd's "Can't recognize 'py -c ...' as an internal or external
      #    command" into the bg buffer, which proves spawn + capture + `type @bg_*` all work here
      #    — only the interpreter is absent. Do NOT re-investigate it as a wine path-handling
      #    failure. (WIN-30)
      #
      # 5. buffer_query_truncation_hint_shows_next_page — permanent, an emulator artifact at ANY
      #    wine version rather than a codescout defect. Every bash.exe under wine emits a 6-line
      #    `Cygwin WARNING: Couldn't compute FAST_CWD pointer` block on stderr; run_command counts
      #    it toward the 100-line display budget, so stdout gets 94 of 300 and the next-page
      #    offset lands at 95 instead of the asserted 101. Do NOT relax the assertion to
      #    accommodate this — the exact arithmetic is what the test is for on real Windows.
      #
      # 6. RESOLVED 2026-09-02 by the wine pin, kept here as the second record of a protocol
      #    that worked. These nine were skipped for HANGS under this lane's wine 9.0 —
      #    heredoc_body_pipes_are_not_rewritten_into_the_written_file,
      #    run_command_with_overflow_emits_progressive_hint_once,
      #    unfiltered_output_carries_a_line_count_and_explicit_empty_stdout,
      #    unfiltered_output_line_count_survives_inline_truncation, and the five
      #    buffer-truncation tests added 2026-08-27
      #    (a_truncated_buffer_reports_the_count_it_will_actually_serve,
      #    a_truncated_buffer_ends_with_a_sentinel_naming_both_counts,
      #    a_grep_over_a_truncated_ref_carries_the_truncation_notice,
      #    a_complete_buffer_carries_no_sentinel_and_no_notice,
      #    read_file_renders_the_truncation_notice_not_just_carries_it).
      #    They are no longer skipped. The remedy was the pin, exactly as the protocol
      #    predicted: none was a codescout defect and none needed editing. If any regresses,
      #    check `WINE_PIN` in the install step FIRST — a hang here means the lane's wine
      #    moved, not that the test changed.
      #    Evidence and the original diagnosis are in GROUP 6 IN DETAIL below.
      #
      # Do NOT make any of these self-skip at runtime on a probe (missing bash, missing `py`,
      # missing git). Every one is load-bearing on windows-latest, where the thing being probed
      # for IS present, and a probe-gated early return disarms it there too. (WIN-32, WIN-36)
      #
      # GROUP 6 IN DETAIL — nine tests, one cause, one remedy. None is a codescout defect
      # and neither is about the shell: on THIS runner's wine the command HANGS and is killed
      # by run_command's own 30s timeout. Both were measured, each from a CI log, and both
      # produced the identical envelope:
      #
      #   {"timed_out":true,"stderr":"Command timed out after 30 seconds","exit_code":null}
      #
      #   heredoc_..._written_file            `cat > note.txt <<'EOF' ... EOF`  (run 32970579826)
      #   run_command_with_overflow_...once   `yes filler | head -2000`         (run 32976889055)
      #   unfiltered_output_carries_a_...     `printf 'a\nb\nc\n' | grep zzz`   (run 32997878934)
      #   unfiltered_output_line_count_...    `seq 1 20000 | grep zzz`          (run 32997878934)
      #
      #   The five tests added 2026-08-27 are skip-listed on ARRIVAL, not after a red run:
      #   they reuse those last two command shapes verbatim (`seq 1 20000 | grep zzz` for the
      #   three truncation cases, `printf 'a\nb\nc\n' | grep zzz` for the complete-buffer
      #   control), and the cause above is a property of the COMMAND under wine, not of what
      #   the test asserts about the result. Un-skip them with the same protocol and in the
      #   same pass as their two predecessors — they share one root cause and one fix.
      #
      # The last two are worth a warning to whoever reads this next, because they ALSO fail
      # locally under wine 11.16 for a COMPLETELY DIFFERENT and unrelated reason — a
      # load-sensitive flake that yields an impossible payload (2 of 4 keys that
      # `output.rs` sets in one block), documented in
      # docs/issues/2026-08-26-wine-lane-flakes-under-load-on-three-tests.md. Same two test
      # names, two distinct causes, and only the payload tells them apart: a `timed_out`
      # envelope is THIS group; a partial key set is that flake. Do not let a local
      # reproduction of one convince you that you have reproduced the other.
      #
      # What they share is a FORKED pipeline or redirection under MSYS, where a child must be
      # reaped and a handle closed before run_command's `output()` can see EOF. Both finish in
      # well under a second under wine 11.16, and both PASS on all three windows-latest lanes —
      # which is where their coverage actually lives, so these skips cost none.
      #
      # Do NOT diagnose either as a codescout bug. The first LOOKED like heredoc content
      # corruption (empty file) until the test was taught to check its write's exit code; the
      # second LOOKED like a missing progressive-disclosure hint until its assertion was taught
      # to print the envelope. In both cases the real answer was the same timeout, and in both
      # cases the bare assertion had been hiding it. (W-60,
      # docs/trackers/bug-fix-session-log.md)
      #
      # Un-skip protocol — BOTH PASSES DONE, and keeping the two-pass shape is the record
      # worth preserving rather than the outcome.
      #
      #   PASS 1 (done, `58d85263`): pin the lane's wine to the local loop's version via the
      #   WineHQ apt repo — see the install step at the top of this job. Every skip was left
      #   in place, so the only question it answered was "does the pin take, and does the
      #   lane stay green under a wine four majors newer". It did, and the pin surfaced three
      #   unrelated Windows defects in the process, which is what a separated pass buys:
      #   they were attributable to the code rather than to the pin.
      #
      #   PASS 2 (done, this commit): drop the nine group-6 skips and re-measure. Deliberately
      #   NOT folded into pass 1 — a red lane carrying both changes cannot say whether the pin
      #   broke something or the un-skipped tests still hang, and pass 1 did in fact come back
      #   red for reasons that were neither.
      #
      # Six skips remain and none is a wine-version question: groups 1, 3, 4 and 5 above are
      # a bisect-proven pre-existing cluster and three documented permanents. Group 1 is the
      # only plausible candidate for a future pass — "pre-existing wine failures" was
      # established under 9.0 and has not been re-measured under 11.16. That is a PASS 3, on
      # its own, for the same reason this was a pass 2.
      #
      # NOT by editing either test, and NOT by raising timeout_secs, which would only make a
      # hang cost more wall-clock before failing the same way.
      # docs/issues/archive/2026-08-26-wine-lane-runs-wine-9-and-diverges-from-the-local-loop.md
      - name: Cross-test under wine (lib only)
        run: scripts/build-windows.sh test --lib -- --skip symbols_path_type --skip symbols_name_path_pattern_in_directory --skip include_docs_attaches_docs_in_search_mode --skip format_compact_live_renders_claude_md_as_map_shape --skip background_command_with_quotes_captures_output --skip buffer_query_truncation_hint_shows_next_page

  tool-docs-sync:
    name: Tool Docs Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all tools are documented
        # Strict: tool registrations under src/tools/**/*.rs must each have a
        # matching ^# `tool_name`$ or ^## `tool_name`$ heading in
        # docs/manual/src/tools/. Test files (tests.rs) and the internal
        # description-cap probe are excluded. Recursive grep with -h to
        # suppress filename prefixes; anchored doc-side regex catches H1 + H2.
        run: |
          grep -rhA1 'fn name(&self)' src/tools/ --include='*.rs' --exclude-dir=tests --exclude='tests.rs' --exclude='probe.rs' \
            | grep -E '^\s*"[a-z_]+"' \
            | sed 's/.*"\(.*\)".*/\1/' \
            | sort -u > /tmp/code-tools.txt
          grep -rohE '^#{1,2} `[a-z_]+`$' docs/manual/src/tools/ | sed 's/.*`\(.*\)`/\1/' | sort -u > /tmp/doc-tools.txt
          diff -u /tmp/code-tools.txt /tmp/doc-tools.txt

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The one job that DOES install a toolchain, because it must not use the pinned
      # one. `rust-version = "1.88"` in Cargo.toml is the promise; this job is the only
      # thing that checks it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # `+1.88` is LOAD-BEARING — do not simplify to `cargo check`. rust-toolchain.toml
      # pins 1.97.1, and a toolchain file beats `rustup default`, so a bare `cargo check`
      # here would compile with 1.97.1 and this job would report MSRV green while never
      # having built with 1.88. An explicit `+<toolchain>` outranks the file, so this is
      # correct whether or not the install step also exports RUSTUP_TOOLCHAIN.
      - run: cargo +1.88 check

  audit-doc-refs:
    name: Audit Doc Refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
        with:
          key: audit-doc-refs
      - run: cargo build --release --bin codescout
      # The audit hits `build_tool_context` which requires a librarian
      # workspace file. Use LIBRARIAN_WORKSPACE to pin a deterministic path
      # (avoids per-platform dirs::config_dir() differences). v6 catalog
      # tolerates zero roots.
      - name: Seed empty librarian workspace
        run: |
          mkdir -p "$HOME/codescout-ci"
          touch "$HOME/codescout-ci/workspace.toml"
          echo "LIBRARIAN_WORKSPACE=$HOME/codescout-ci/workspace.toml" >> "$GITHUB_ENV"
      # All previously-known hi-sev findings have been reconciled (the
      # 2026-05-13 semantic-anchors ADR dropped its stale src/embed/index.rs
      # citation). Gate is now `--fail-on high` so any future hi-sev
      # reintroduction fails the build.
      - name: Audit markdown for stale code references
        run: ./target/release/codescout audit-doc-refs --no-emit-tracker --fail-on high --json --project .
