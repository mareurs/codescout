name: CI

on:
  push:
    branches: [master, experiments]
  pull_request:

# One 15-job matrix per push starves the runner pool when pushes land in a row: on
# 2026-08-06, six pushes to `experiments` left 72 jobs contending, with the tip's run
# queued behind ~57 jobs belonging to commits it already superseded. Superseding runs
# for the same ref fixes that at the source. `master` is exempt — a protected branch's
# runs must always complete, never be cancelled by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

# No job installs a toolchain. `rust-toolchain.toml` pins the version and declares the
# components and targets, and rustup honors it automatically on the first cargo call in
# the repo — so a toolchain-install step is not just redundant here, it is harmful.
#
# DO NOT add `dtolnay/rust-toolchain` back. That action exports RUSTUP_TOOLCHAIN for
# subsequent steps, and the environment variable OVERRIDES rust-toolchain.toml. The jobs
# would then run on whatever the action resolved while the pin file sat inert, which is
# precisely the local-vs-CI skew the pin exists to remove — and it would be silent,
# because everything still compiles. See rust-toolchain.toml for the W-9 / F-9 history.
#
# The one exception is the `msrv` job, which deliberately installs 1.88 and invokes it
# as `cargo +1.88` so the explicit override beats the pin file. Read its comment before
# touching it.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings
      # --workspace --all-targets --features local-embed: the bare command
      # above only lints the root package's non-test targets with default
      # features, which don't include local-embed — so codescout-embed's
      # `local` module (cfg-gated on that feature) is never even compiled
      # here, and nothing in it, tests included, is clippy-checked in CI.
      # Same root cause as the `test` job's --workspace gap above, just one
      # command over. Verified empirically 2026-08-11: `cargo clippy --
      # -D warnings` shows `Checking codescout-embed` but that's the
      # default-features build (no `local` module); this second pass is
      # what actually reaches local.rs and its tests.
      - run: cargo clippy --workspace --all-targets --features local-embed -- -D warnings

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.config.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config:
          - name: default
            flags: ""
          - name: local-embed
            flags: "--features local-embed --no-default-features"
          - name: no-features
            flags: "--no-default-features"
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.config.name }}
      # Tests with the librarian feature on (default + local-embed configs)
      # construct CodeScoutServer instances which try to build_tool_context.
      # That call requires a librarian workspace file; seed an empty one so
      # the relevant tools register on fresh CI runners. Use LIBRARIAN_WORKSPACE
      # env var (per src/librarian/mod.rs:32) to point at a fixed path, avoiding
      # the per-platform dirs::config_dir() differences ($HOME/.config on Linux,
      # $HOME/Library/Application Support on macOS, $APPDATA on Windows). v6
      # catalog tolerates zero roots.
      #
      # Use ${{ runner.temp }} (native path on each platform) instead of bash $HOME:
      # on Windows, bash $HOME is the Git Bash POSIX form (/c/Users/...) which
      # Rust on Windows cannot read as a file path. runner.temp is D:\a\_temp
      # on Windows and /home/runner/work/_temp on Linux — always native.
      - name: Seed empty librarian workspace
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/codescout-ci"
          touch "${{ runner.temp }}/codescout-ci/workspace.toml"
          echo "LIBRARIAN_WORKSPACE=${{ runner.temp }}/codescout-ci/workspace.toml" >> "$GITHUB_ENV"
      # The local-embed lane needs real AllMiniLM-L6-v2 weights on disk for
      # from_dir_produces_a_stable_384d_vector and
      # from_dir_matches_the_hub_path_for_the_same_model
      # (crates/codescout-embed/src/local.rs) — the only tests that catch a
      # correctly-shaped-but-silently-wrong vector (wrong tokenizer/pooling).
      # Every other lane sets the explicit opt-out below instead, so the
      # tests are skipped on purpose rather than failing on a lane that was
      # never meant to carry the weights.
      #
      # Use ${{ runner.temp }} rather than bash $HOME: on Windows, bash $HOME
      # is the Git Bash POSIX form (/c/Users/...), which Rust on Windows
      # cannot read as a file path — the same reasoning as the
      # librarian-workspace seed step above, and this path is consumed the
      # same way (an env var that becomes a Rust PathBuf).
      #
      # Cache restores BEFORE the download (not after) so a hit skips the
      # curl entirely — key includes ${{ matrix.os }} (matching this file's
      # own rust-cache key convention two steps up) so three OSes racing to
      # save the same un-scoped key don't stomp each other's save.
      - name: Cache ONNX weights
        id: onnx-cache
        if: matrix.config.name == 'local-embed'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/codescout-onnx
          key: ${{ matrix.os }}-onnx-all-minilm-l6-v2-q-v1

      - name: Seed ONNX weights (local-embed lane only, cache miss)
        if: matrix.config.name == 'local-embed' && steps.onnx-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ runner.temp }}/codescout-onnx/all-MiniLM-L6-v2"
          mkdir -p "$DIR/onnx"
          BASE="https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main"
          curl -fsSL "$BASE/onnx/model_quantized.onnx" -o "$DIR/onnx/model_quantized.onnx"
          for f in tokenizer.json config.json special_tokens_map.json tokenizer_config.json; do
            curl -fsSL "$BASE/$f" -o "$DIR/$f"
          done

      # from_dir_matches_the_hub_path_for_the_same_model also builds an embedder
      # via the hub path (LocalEmbedder::new), which pulls AllMiniLM-L6-v2-Q into
      # fastembed's own cache — FASTEMBED_CACHE_DIR if set, else `.fastembed_cache`
      # relative to CWD (Cargo runs codescout-embed's own test binary from that
      # package's directory, not the workspace root — see the .gitignore fix in
      # this same PR). Left unset, that's a second, uncached ~22MB download per
      # job on three OSes, and an HF hiccup fails the lane on `.expect("hub model
      # must load")`. Point it at a subdirectory of the same cached tree above so
      # the one cache step covers both the from_dir weights and this download.
      - name: Point env at the cached ONNX/fastembed dirs (local-embed lane only)
        if: matrix.config.name == 'local-embed'
        shell: bash
        run: |
          echo "CODESCOUT_TEST_ONNX_DIR=${{ runner.temp }}/codescout-onnx/all-MiniLM-L6-v2" >> "$GITHUB_ENV"
          echo "FASTEMBED_CACHE_DIR=${{ runner.temp }}/codescout-onnx/fastembed-cache" >> "$GITHUB_ENV"

      - name: Opt out of ONNX tests (non-local-embed lanes)
        if: matrix.config.name != 'local-embed'
        shell: bash
        run: echo "CODESCOUT_SKIP_ONNX_TESTS=1" >> "$GITHUB_ENV"
      # --workspace: without it, `cargo test` here only builds the default
      # member of this non-virtual workspace (the root `codescout` package —
      # see `default-members` in the Cargo reference). codescout-embed compiles
      # as a dependency but its own `#[cfg(test)]` suite — chunker tests, the
      # smoke test, and every local.rs test including the two added in this
      # task — never runs. Verified empirically 2026-08-11: bare
      # `cargo test --features local-embed --no-default-features` shows
      # `codescout-embed` only in the Compiling lines, never in a `Running`
      # line; adding `--workspace` makes it appear and all 27 of its tests
      # execute, with 0 regressions across all three configs.
      - run: cargo test --workspace ${{ matrix.config.flags }}

  # The configuration `cargo rb` actually ships.
  #
  # `.cargo/config.toml` defines `rb = "build --release --features server-stack"`,
  # and that is the command CLAUDE.md mandates for the live MCP release binary. Until
  # 2026-08-08 no lane compiled it, so the build everyone runs was the one build CI
  # never built — and every `#[cfg(feature = "server-stack")]` test was skipped
  # silently, which is indistinguishable from a test that does not exist. When the
  # lane was finally run it failed immediately, on a real defect
  # (docs/issues/archive/2026-08-08-index-probe-scrolls-the-whole-corpus-to-answer-a-yes-no.md).
  #
  # Linux-only on purpose: `cargo rb` is the Linux dev-box build, and the matrix above
  # already covers default/lean across three OSes. The point is that SOME lane compiles
  # this, not that every platform does.
  #
  # No Qdrant service container is needed — the tests are hermetic. `check_has_index`
  # returns false when the stack is unreachable, and the cache test drives
  # `resolve_first_probe` directly rather than performing a live probe. If a future test
  # here needs a live stack, give it a service container rather than making this lane
  # depend on ambient reachability.
  test-server-stack:
    name: Test (server-stack — the build cargo rb ships)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-latest-server-stack
      # server-stack sits on top of the default feature set, so `librarian` is on and
      # build_tool_context needs a workspace file — same seeding as the matrix job.
      - name: Seed empty librarian workspace
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/codescout-ci"
          touch "${{ runner.temp }}/codescout-ci/workspace.toml"
          echo "LIBRARIAN_WORKSPACE=${{ runner.temp }}/codescout-ci/workspace.toml" >> "$GITHUB_ENV"
      - run: cargo clippy --features server-stack --all-targets -- -D warnings
      - run: cargo test --features server-stack

  # Compile-only lanes for the opt-in features nothing else builds.
  #
  # `dashboard` and `local-embed-dynamic` are in neither `default` nor any other lane,
  # so until 2026-08-08 they were bit-rot candidates for the same reason `server-stack`
  # was — nothing compiled them, and nothing said so. A `cargo check` is enough: these
  # are opt-in build configurations, and the question is whether they still compile, not
  # whether their behaviour is covered.
  #
  # tests/feature_lanes.rs enforces that every feature is either built somewhere,
  # reached through `default`, or explicitly exempt with a reason. Adding a feature
  # without doing one of those fails that test — which is the point.
  feature-check:
    name: Feature check (opt-in build configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-latest-feature-check
      - run: cargo check --features dashboard --all-targets
      - run: cargo check --features local-embed-dynamic --all-targets
      # `retrieval-e2e` is EXEMPT (tests/feature_lanes.rs) from *running* — it needs a
      # live Qdrant + TEI/Ollama stack no CI runner has. That justifies not running
      # tests/retrieval_e2e.rs, not skipping compilation of it: a `cargo check` here
      # is exactly the "enough to catch bit-rot" bar this job's own header comment
      # describes, and tests/retrieval_e2e.rs previously rotted for a full review
      # round (4 call sites broke under a `RetrievalClient::from_env` signature
      # change with nothing here to catch it) — the same shape as the archived
      # server-stack bit-rot (0863519e142b71bc) this job exists to prevent.
      - run: cargo check --features retrieval-e2e --all-targets
      # The five `e2e-*` lanes are EXEMPT (tests/feature_lanes.rs) from *running* too —
      # each needs a language server (rust-analyzer, pyright, typescript-language-server,
      # kotlin-lsp, jdtls) no runner has. Exactly the distinction drawn for
      # `retrieval-e2e` above, and it was simply never applied here: all five then
      # stopped compiling at once — `ToolContext` grew a field and `tests/e2e/harness.rs`
      # never got it — while `cargo test` stayed green throughout, because nothing builds
      # a feature-gated target that no lane names. Found by accident, not by a gate
      # (bug-fix-session-log F-62). `e2e` is the meta-feature enabling all five, so this
      # one check covers the family; `every_exempt_feature_is_still_compiled_somewhere`
      # now fails if any exemption loses its compile lane.
      - run: cargo check --features e2e --all-targets

  windows-gnu:
    name: Windows-gnu cross (MinGW + wine)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW + wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine wine64 p7zip-full
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gnu-cross
      - name: Cross-build (default features)
        run: scripts/build-windows.sh build
      # The host Clippy job cannot see this cfg. #[cfg(windows)] code is invisible to
      # it, and code it CAN see may lint differently once the #[cfg(unix)] arms are
      # erased — a `return` becomes needless when everything after it compiles out.
      # Two such lints reached this branch and were only found by running clippy on a
      # Windows host, which is exactly the manual step this lane exists to replace.
      # docs/issues/archive/2026-08-08-clippy-pre-existing-drift-stable-gnu-toolchain.md
      - name: Cross-clippy (default features)
        run: scripts/build-windows.sh clippy --all-targets -- -D warnings

      # Anything that shells out needs a WINDOWS bash: codescout runs commands through
      # Git Bash, and wine ships none. Without one, 8 tests die on "no POSIX shell
      # available" — 6 of them the guide_hint cluster this lane deliberately UN-skipped
      # on 2026-07-05 (see the skip-list comment below), plus 2 run_command tests.
      # Re-skipping them would hand back coverage someone argued for; giving the lane a
      # shell keeps it. It also matters for signal, not just count: locally this gap was
      # hiding a real Windows defect behind 8 environmental failures until the shell was
      # supplied (W-59, docs/trackers/bug-fix-session-log.md).
      #
      # PortableGit is a 7z SELF-EXTRACTING archive, so `7z x` unpacks it here with no
      # installer executing. Cache restores BEFORE the download, same convention as the
      # ONNX weights step in the matrix job above.
      - name: Cache PortableGit
        id: portablegit-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/portable-git
          key: portable-git-2.55.0.5-64-bit

      - name: Seed PortableGit (cache miss)
        if: steps.portablegit-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ runner.temp }}/portable-git"
          mkdir -p "$DIR"
          URL="https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/PortableGit-2.55.0.5-64-bit.7z.exe"
          curl -fsSL "$URL" -o "${{ runner.temp }}/PortableGit.7z.exe"
          7z x -y -o"$DIR" "${{ runner.temp }}/PortableGit.7z.exe" > /dev/null

      # The value must be a WINDOWS path: wine maps `/` to `Z:`, and `resolve_git_bash`
      # does a plain `is_file()` probe that a Unix path fails SILENTLY — the symptom is
      # the same 8 failures, with nothing pointing at the variable.
      - name: Point codescout at Git Bash under wine
        shell: bash
        run: |
          set -euo pipefail
          UNIX_PATH="${{ runner.temp }}/portable-git/bin/bash.exe"
          test -f "$UNIX_PATH" || { echo "PortableGit missing at $UNIX_PATH" >&2; exit 1; }
          echo "CODESCOUT_BASH=Z:${UNIX_PATH//\//\\}" >> "$GITHUB_ENV"
      # 12 pre-existing wine failures skipped (bisect-proven pre-existing; NOT regressions),
      # plus one NEW test (59df5c9e) that exercises the same wine-broken glob-walk path.
      # The 8-test guide_hint cluster is no longer skipped: fixed 2026-07-05 by seeding
      # LIBRARIAN_WORKSPACE in make_server (build_tool_context no longer depends on the
      # ambient ~/.config/librarian/workspace.toml, which is absent under wine).
      # Inventory + un-skip protocol: docs/issues/2026-07-02-windows-gnu-wine-20-test-failures.md (WIN-27)
      # background_command_with_quotes_captures_output — root cause now KNOWN (2026-08-07), so this
      # skip is permanent rather than pending investigation: wine has no Python launcher, and the
      # test's command is `py -c "..."`. Run under wine it captures cmd's
      # "Can't recognize 'py -c ...' as an internal or external command" into the bg buffer, which
      # proves spawn + capture + `type @bg_*` all work there — only the interpreter is absent. Do
      # NOT re-investigate it as a wine path-handling failure, and do not make the test self-skip
      # on a missing `py`: it stays load-bearing on windows-latest, where `py` IS present, and a
      # probe-gated early return would silently disarm the MSVC-CRT quote-mangling guard, which is
      # the only place the test has value. (WIN-30)
      # The 21 run_command / Git Bash skips below are ENVIRONMENTAL, not defects, and the
      # reason is one line: this wine image has no Git for Windows. Since WIN-32 every
      # Windows spawn goes through Git Bash, so with none installed `run_command` cannot
      # run at all here. codescout now says so up front — `shell_unavailable_hint()` turns
      # the OS's bare `program not found` into a RecoverableError naming CODESCOUT_BASH —
      # but a tool that correctly refuses to run is still a failing spawn test.
      # Un-skip protocol: install Git for Windows in the wine image (or set CODESCOUT_BASH
      # to a bash.exe wine can execute) and drop this block wholesale — there is no
      # per-test triage to do, they share one cause. Do NOT make these tests self-skip on a
      # missing bash: they are load-bearing on windows-latest, where Git Bash IS present,
      # and a probe-gated early return would disarm them there too. (WIN-32, WIN-36)
      - name: Cross-test under wine (lib only)
        run: scripts/build-windows.sh test --lib -- --skip symbols_path_type --skip symbols_name_path_pattern_in_directory --skip include_docs_attaches_docs_in_search_mode --skip activate_populates_head_sha --skip check_index_scope_respects_gitignore --skip reindex_backfills_commits_table --skip format_compact_live_renders_claude_md_as_map_shape --skip background_command_with_quotes_captures_output --skip symbols_overview_glob_marks_grammarless --skip msys_form_path_resolves_for_native_binaries --skip run_command_with_overflow_emits_progressive_hint_once --skip run_command_without_overflow_no_progressive_hint --skip run_command_output_keeps_absolute_project_paths --skip ack_handle_executes_stored_command --skip buffer_query_returns_up_to_200_lines_inline --skip buffer_query_truncation_hint_shows_next_page --skip cat_file_no_hint_field --skip execute_shell_command_echo_cross_platform --skip execute_shell_command_exit_code_preserved --skip execute_shell_command_fast_command_succeeds --skip execute_shell_command_small_output_not_truncated --skip non_filter_pipe_no_unfiltered_ref --skip run_command_buffer_only_skips_speed_bump --skip run_command_dangerous_allowed_with_acknowledge --skip run_command_does_not_include_warning --skip run_command_short_output_returned_directly --skip run_command_safe_command_not_blocked --skip run_command_source_block_bypassed_with_acknowledge_risk --skip run_command_source_block_not_triggered_for_non_source --skip run_command_source_block_not_triggered_for_markdown --skip run_in_background_returns_bg_handle

  tool-docs-sync:
    name: Tool Docs Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all tools are documented
        # Strict: tool registrations under src/tools/**/*.rs must each have a
        # matching ^# `tool_name`$ or ^## `tool_name`$ heading in
        # docs/manual/src/tools/. Test files (tests.rs) and the internal
        # description-cap probe are excluded. Recursive grep with -h to
        # suppress filename prefixes; anchored doc-side regex catches H1 + H2.
        run: |
          grep -rhA1 'fn name(&self)' src/tools/ --include='*.rs' --exclude-dir=tests --exclude='tests.rs' --exclude='probe.rs' \
            | grep -E '^\s*"[a-z_]+"' \
            | sed 's/.*"\(.*\)".*/\1/' \
            | sort -u > /tmp/code-tools.txt
          grep -rohE '^#{1,2} `[a-z_]+`$' docs/manual/src/tools/ | sed 's/.*`\(.*\)`/\1/' | sort -u > /tmp/doc-tools.txt
          diff -u /tmp/code-tools.txt /tmp/doc-tools.txt

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The one job that DOES install a toolchain, because it must not use the pinned
      # one. `rust-version = "1.88"` in Cargo.toml is the promise; this job is the only
      # thing that checks it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # `+1.88` is LOAD-BEARING — do not simplify to `cargo check`. rust-toolchain.toml
      # pins 1.97.1, and a toolchain file beats `rustup default`, so a bare `cargo check`
      # here would compile with 1.97.1 and this job would report MSRV green while never
      # having built with 1.88. An explicit `+<toolchain>` outranks the file, so this is
      # correct whether or not the install step also exports RUSTUP_TOOLCHAIN.
      - run: cargo +1.88 check

  audit-doc-refs:
    name: Audit Doc Refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.7
      - uses: Swatinem/rust-cache@v2
        with:
          key: audit-doc-refs
      - run: cargo build --release --bin codescout
      # The audit hits `build_tool_context` which requires a librarian
      # workspace file. Use LIBRARIAN_WORKSPACE to pin a deterministic path
      # (avoids per-platform dirs::config_dir() differences). v6 catalog
      # tolerates zero roots.
      - name: Seed empty librarian workspace
        run: |
          mkdir -p "$HOME/codescout-ci"
          touch "$HOME/codescout-ci/workspace.toml"
          echo "LIBRARIAN_WORKSPACE=$HOME/codescout-ci/workspace.toml" >> "$GITHUB_ENV"
      # All previously-known hi-sev findings have been reconciled (the
      # 2026-05-13 semantic-anchors ADR dropped its stale src/embed/index.rs
      # citation). Gate is now `--fail-on high` so any future hi-sev
      # reintroduction fails the build.
      - name: Audit markdown for stale code references
        run: ./target/release/codescout audit-doc-refs --no-emit-tracker --fail-on high --json --project .
