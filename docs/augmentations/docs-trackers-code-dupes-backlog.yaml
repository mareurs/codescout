schema_version: 1
prompt: 'This tracker is the working backlog for code-dupes findings (structural duplication in src/, scanned 2026-07-08 at HEAD b2853b4d). To act: take the lowest-numbered `open` issue from the table above, read its ''## Per-issue detail'' section in the body for Symptom/Root cause/Fix/Predicted impact, re-verify the referenced code still matches current disk state (files may have moved or been edited since the scan) via `symbols`, apply the fix, run `cargo fmt && cargo clippy -- -D warnings && cargo test`, commit, then flip that issue''s `status` to `fixed` in params (via `artifact_augment(merge=true)`) and append a one-line note with the commit SHA to its body subsection. To maintain: don''t renumber issues — new code-dupes findings from a future scan get the next integer. `wontfix` is reserved for confirmed false positives (AST-shape coincidence, not real semantic duplication) — the body subsection must say why. Params hold only n/title/severity/status/location for the render table; all narrative (symptom, root cause, fix plan, impact) lives in the body''s Per-issue detail sections — never duplicate prose into params.'
