schema_version: 1
prompt: 'Maintain the retrieval benchmark run log. Each entry in `params.runs` is one bench invocation against the pinned worktree at `params.baseline_sha`. When a new bench JSON is produced under `/tmp/bench-*.json` or `docs/research/`, append a single run record with: date, label, model, boost, sparse (true/false), score, p50_ms, p95_ms, collection, result_path. Don''t mutate existing rows — append-only. If the baseline_sha changes, treat the whole table as compromised and add a body note flagging the discontinuity. Narrative belongs in the body (how-to-run section, caveats), not in params.'
